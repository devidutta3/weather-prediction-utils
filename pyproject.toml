[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-prediction-utils"
version = "0.2.0"
description = "Weather prediction using a trained Machine Learning model."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Devidutta Das", email = "dasdevidutta3@gmail.com"}
]

keywords = [
    "weather",
    "machine-learning",
    "prediction",
    "temperature",
    "python"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["weather_prediction*"]

[tool.setuptools.package-data]
weather_prediction = ["*.pkl"]

[project.urls]
Homepage = "https://github.com/devidutta3/weather-prediction-utils"
Documentation = "https://github.com/devidutta3/weather-prediction-utils"
Repository = "https://github.com/devidutta3/weather-prediction-utils"
Issues = "https://github.com/devidutta3/weather-prediction-utils/issues"